<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" width="1500" height="860" font-family="Helvetica, Arial, sans-serif">
  <title>ENR312 pendulum rig: power, ground and measurement points</title>
  <defs>
    <style>
      .box{fill:#f7f9fc;stroke:#1b2a44;stroke-width:2}
      .t{font-size:15px;fill:#1b2a44}.h{font-size:19px;font-weight:bold;fill:#1b2a44}
      .s{font-size:12.5px;fill:#33404f}.warn{font-size:13px;fill:#b3261e;font-weight:bold}
      .w{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .p12{stroke:#d12f2f}.p5{stroke:#e8862a}.p33{stroke:#c9a400}.g{stroke:#222}.usb{stroke:#555;stroke-dasharray:8 5}
      .mp{fill:#fff;stroke:#2a62c9;stroke-width:2.5}.mpt{font-size:13px;font-weight:bold;fill:#2a62c9}
    </style>
  </defs>
  <rect width="1500" height="860" fill="#fff"/>
  <text x="30" y="40" class="h" font-size="24">Power, ground and measurement points</text>
  <text x="30" y="64" class="s">Blue circles are multimeter points, done in order A (nothing powered), B (USB only), C (12 V, motor SAFE), D (ARMED). Expected values: docs/hardware/ENR312_WIRING.md section 4.</text>

  <!-- USB domain -->
  <rect x="30" y="110" width="200" height="100" rx="10" class="box"/>
  <text x="50" y="140" class="h">PC USB</text>
  <text x="50" y="162" class="s">5 V, ≤ 500 mA</text>
  <text x="50" y="180" class="s">logic + ST-LINK + encoder</text>
  <path d="M230 160 H320" class="w usb"/>

  <rect x="320" y="100" width="420" height="300" rx="10" class="box"/>
  <text x="340" y="130" class="h">NUCLEO-F401RE (logic domain)</text>
  <rect x="345" y="150" width="150" height="60" fill="#fff8e8" stroke="#e8862a" stroke-width="1.5"/>
  <text x="355" y="175" class="t">5 V rail (U5V)</text><text x="355" y="195" class="s">JP5 on U5V</text>
  <rect x="545" y="150" width="170" height="60" fill="#fffbe0" stroke="#c9a400" stroke-width="1.5"/>
  <text x="555" y="175" class="t">3.3 V regulator</text><text x="555" y="195" class="s">MCU, PB4/PB5 pull-ups</text>
  <path d="M495 180 H545" class="w p5"/>
  <rect x="545" y="250" width="170" height="70" fill="#e4ebf5" stroke="#1b2a44" stroke-width="1.5"/>
  <text x="555" y="275" class="t">STM32F401RE</text><text x="555" y="295" class="s">PB4/PB5 internal</text><text x="555" y="311" class="s">pull-up ~40 kΩ to 3.3 V</text>
  <path d="M630 210 V250" class="w p33"/>
  <circle cx="420" cy="230" r="13" class="mp"/><text x="410" y="235" class="mpt">B1</text>
  <text x="440" y="235" class="s">5V pin: 4.75-5.25 V</text>
  <circle cx="420" cy="265" r="13" class="mp"/><text x="410" y="270" class="mpt">B1</text>
  <text x="440" y="270" class="s">3V3 pin: 3.2-3.4 V</text>
  <text x="345" y="380" class="s">GND pins (several) = one node</text>

  <!-- Encoder -->
  <rect x="320" y="470" width="420" height="200" rx="10" class="box"/>
  <text x="340" y="500" class="h">LPD3806 encoder</text>
  <text x="340" y="522" class="s">powered from the Nucleo 5V pin; A/B open collector</text>
  <path d="M362 210 V330 H260 V560 H340" class="w p5"/>
  <text x="270" y="552" class="s">+5V red</text>
  <circle cx="470" cy="580" r="13" class="mp"/><text x="460" y="585" class="mpt">A3</text>
  <text x="490" y="585" class="s">A→red, B→red (all off): &gt; 100 kΩ</text>
  <circle cx="470" cy="615" r="13" class="mp"/><text x="461" y="620" class="mpt">B2</text>
  <text x="490" y="620" class="s">A, B to GND, NOT on Nucleo: ≤ 3.6 V</text>
  <circle cx="470" cy="650" r="13" class="mp"/><text x="461" y="655" class="mpt">B3</text>
  <text x="490" y="655" class="s">D5/D4 when connected: 0 ↔ 3.3 V</text>
  <path d="M630 320 V470" class="w" stroke="#1d8a4a"/>
  <text x="640" y="430" class="s">A → D5 (PB4)</text><text x="640" y="448" class="s">B → D4 (PB5)</text>

  <!-- 12 V domain -->
  <rect x="860" y="100" width="260" height="110" rx="10" class="box"/>
  <text x="880" y="130" class="h">12 V supply</text>
  <text x="880" y="152" class="s">motor domain only</text>
  <circle cx="1145" cy="140" r="13" class="mp"/><text x="1135" y="145" class="mpt">A2</text>
  <text x="1165" y="145" class="s">unplugged from shield: 11.4-12.6 V,</text>
  <text x="1165" y="163" class="s">record which conductor is +</text>
  <path d="M960 210 V260" class="w p12"/>
  <rect x="945" y="260" width="30" height="40" fill="#fff" stroke="#d12f2f" stroke-width="2"/>
  <text x="985" y="285" class="s">fuse 2 A slow-blow</text>
  <path d="M960 300 V330" class="w p12"/>
  <path d="M960 330 L985 350" class="w p12"/>
  <circle cx="960" cy="330" r="4" fill="#1b2a44"/><circle cx="960" cy="360" r="4" fill="#1b2a44"/>
  <text x="995" y="352" class="warn">switch = E-STOP</text>
  <path d="M960 360 V420" class="w p12"/>
  <path d="M1080 210 V400 H1060 V420" class="w g"/>

  <rect x="860" y="420" width="360" height="250" rx="10" class="box"/>
  <text x="880" y="450" class="h">X-NUCLEO-IHM01A1 (motor domain)</text>
  <text x="880" y="472" class="s">CN1-1 VS (+12 V), CN1-2 GND</text>
  <rect x="880" y="490" width="150" height="80" fill="#e4ebf5" stroke="#1b2a44" stroke-width="1.5"/>
  <text x="895" y="520" class="t">L6474 bridges</text><text x="895" y="540" class="s">SAFE: in reset,</text><text x="895" y="556" class="s">outputs high-Z</text>
  <circle cx="1065" cy="500" r="13" class="mp"/><text x="1055" y="505" class="mpt">A5</text>
  <text x="1085" y="505" class="s">VS↔GND, off: no short</text>
  <circle cx="1065" cy="535" r="13" class="mp"/><text x="1056" y="540" class="mpt">C1</text>
  <text x="1085" y="540" class="s">VS, 12 V on: 11.4-12.6 V</text>
  <circle cx="1065" cy="570" r="13" class="mp"/><text x="1056" y="575" class="mpt">C2</text>
  <text x="1085" y="575" class="s">I supply, SAFE: &lt; 0.1 A</text>
  <circle cx="1065" cy="605" r="13" class="mp"/><text x="1055" y="610" class="mpt">D1</text>
  <text x="1085" y="610" class="s">ARMED: holds, &lt; 1 A</text>
  <path d="M1220 520 H1300" class="w" stroke="#e07a10"/><path d="M1220 560 H1300" class="w" stroke="#e07a10"/>

  <rect x="1300" y="470" width="170" height="150" rx="10" class="box"/>
  <text x="1318" y="500" class="h">NEMA17</text>
  <circle cx="1330" cy="540" r="13" class="mp"/><text x="1320" y="545" class="mpt">A1</text>
  <text x="1350" y="545" class="s">coil pairs:</text>
  <text x="1318" y="570" class="s">2 pairs a few Ω, equal</text>
  <text x="1318" y="588" class="s">±10 %; other 4 open</text>
  <text x="1318" y="606" class="s">(motor unplugged)</text>

  <!-- ground -->
  <path d="M960 670 V740 H520 V670" class="w g"/>
  <path d="M520 400 V470" class="w g"/>
  <text x="560" y="765" class="t" font-weight="bold">Common ground through the stacked headers (CN5-7, CN6-6/7)</text>
  <circle cx="740" cy="740" r="13" class="mp"/><text x="730" y="745" class="mpt">A4</text>
  <text x="30" y="795" class="s">A4: shield on the Nucleo, nothing powered: CN1-2 ↔ Nucleo GND &lt; 1 Ω. If open, STOP: the encoder and driver signals would have no common reference.</text>
  <text x="30" y="830" class="warn">Power-up order (Lab handout, safer): USB first, verify B1-B3, then 12 V. Power-down: 12 V first. The 12 V switch is the only hardware E-stop.</text>
</svg>
